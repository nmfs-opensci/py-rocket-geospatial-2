name: "Create draft release"
description: "Create a draft GitHub Release using VERSION from Dockerfile (YYYY.MM.DD). Prepends a standard description and then appends autogenerated notes."

inputs:
  tag_prefix:
    description: "Optional prefix for the tag (e.g. v). Default is empty."
    required: false
    default: ""
  dockerfile_path:
    description: "Path to Dockerfile to parse version from"
    required: false
    default: "Dockerfile"
  target:
    description: "Git ref/sha to tag (default: current commit SHA)"
    required: false
    default: ""
  generate_notes:
    description: "Whether to auto-generate release notes (true/false)"
    required: false
    default: "true"
  description_path:
    description: "Path to a markdown file containing the standard release description to prepend"
    required: false
    default: ".github/release/description.md"
  release_tag:
    description: "Override the release tag. If blank, the tag is derived from the Dockerfile VERSION and tag_prefix."
    required: false
    default: ""
  force_update:
    description: "If 'true' and a draft release with this tag already exists, update it instead of failing."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: "Extract and validate VERSION"
      id: ver
      shell: bash
      run: |
        set -euo pipefail
        df="${{ inputs.dockerfile_path }}"

        if [ ! -f "$df" ]; then
          echo "::error::Dockerfile not found at: $df"
          exit 1
        fi

        if grep -q "LABEL org.opencontainers.image.version=" "$df"; then
          version=$(grep "LABEL org.opencontainers.image.version=" "$df" | head -1 | cut -d '=' -f2- | tr -d ' "')
        elif grep -q "LABEL VERSION=" "$df"; then
          version=$(grep "LABEL VERSION=" "$df" | head -1 | cut -d '=' -f2- | tr -d ' "')
        else
          echo "::error::No VERSION label found in $df"
          exit 1
        fi

        if ! echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
          echo "::error::Invalid VERSION format: '$version' (expected YYYY.MM.DD)"
          exit 1
        fi

        # Use release_tag override if provided, otherwise derive from tag_prefix + version
        if [ -n "${{ inputs.release_tag }}" ]; then
          tag="${{ inputs.release_tag }}"
        else
          tag="${{ inputs.tag_prefix }}${version}"
        fi
        echo "Resolved tag: $tag"

        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: "Create or update draft release (prepends standard description + What changed)"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        tag="${{ steps.ver.outputs.tag }}"
        title="Release ${tag}"
        target="${{ inputs.target }}"
        desc="${{ inputs.description_path }}"

        if [ -z "$target" ]; then
          target="${GITHUB_SHA}"
        fi

        body_file="$(mktemp)"

        # Prepend standard description if present; otherwise warn but continue.
        if [ -f "$desc" ]; then
          cat "$desc" > "$body_file"
        else
          echo "::warning::Standard release description file not found at '$desc' (continuing without it)."
          : > "$body_file"
        fi

        # Add separator + What changed header
        {
          echo ""
          echo "---"
          echo "## What changed"
          echo ""
        } >> "$body_file"

        # Append auto-generated release notes via API (avoids --generate-notes flag compatibility issues)
        if [ "${{ inputs.generate_notes }}" = "true" ]; then
          generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --method POST \
            --field tag_name="$tag" \
            --field target_commitish="$target" \
            --jq '.body' 2>&1) && api_ok=true || api_ok=false
          if [ "$api_ok" = "true" ] && [ -n "$generated" ]; then
            echo "$generated" >> "$body_file"
          elif [ "$api_ok" = "false" ]; then
            echo "::warning::Failed to generate release notes via API: $generated"
          else
            echo "::notice::Auto-generated release notes were empty; body will contain only the standard description."
          fi
        fi

        # Check if a release with this tag already exists
        release_info=$(gh release view "$tag" --json isDraft 2>/dev/null || echo "")

        if [ -n "$release_info" ]; then
          is_draft=$(echo "$release_info" | jq -r '.isDraft')
          if [ "$is_draft" = "true" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            # Update existing draft release
            gh release edit "$tag" --draft --title "$title" --target "$target" --notes-file "$body_file"
            echo "✓ Updated existing draft release for tag $tag"
          elif [ "$is_draft" != "true" ]; then
            echo "::error::Release for tag '$tag' already exists and is not a draft. Cannot update a published release."
            exit 1
          else
            echo "::error::Draft release for tag '$tag' already exists. Rerun with force_update=true to update it, or choose a different tag."
            exit 1
          fi
        else
          # Create new draft release
          gh release create "$tag" --draft --title "$title" --target "$target" --notes-file "$body_file"
          echo "✓ Draft release created for tag $tag"
        fi

