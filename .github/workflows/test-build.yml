name: Test build (branch -> test image)

# Test build for trying a change before it reaches main (push to `test`, or run by hand).
# Builds the image from the chosen branch, runs the tests/test-*.ipynb notebooks
# and package validation, and pushes ONLY to the separate test image:
#   ghcr.io/<owner>/<repo>/test:latest and :<short sha>
# It never pushes :latest or a version tag of the real image, never opens a
# pins PR, and never makes a release. Use the branch picker ("Use workflow from")
# or the `ref` input to choose what to build.
#
# Pushing to the `test` branch also runs it (as in py-rocket-base). Push events
# use the workflow file from the pushed commit, so this works before the file
# is on main:
#   git push origin <your-branch>:test     (add --force-with-lease to replace what is there)

on:
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (default: the branch the workflow runs from)"
        required: false
        type: string
        default: ""
      skip_tests:
        description: "Skip notebook tests and package validation, push the test image anyway"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short=7 HEAD)
          test_image="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/test"
          echo "TEST_IMAGE=${test_image}" >> $GITHUB_ENV
          echo "TAG=${short_sha}" >> $GITHUB_ENV
          echo "Building $(git rev-parse --abbrev-ref HEAD) @ ${short_sha} -> ${test_image}"

      - name: Build the Docker image
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build . \
            -f Dockerfile \
            --secret id=github_pat,env=GITHUB_PAT \
            --tag ${TEST_IMAGE}:${TAG} \
            --tag ${TEST_IMAGE}:latest

      - name: Report image size
        run: docker image ls ${TEST_IMAGE}:${TAG}

      - name: Run notebook tests (all test-*.ipynb)
        if: ${{ !inputs.skip_tests }}
        uses: ./.github/actions/run-notebook-test
        with:
          image: ${{ env.TEST_IMAGE }}:${{ env.TAG }}
          tests_dir: tests
          pattern: "test-*.ipynb"
          exclude_pattern: "*-output.ipynb"
          output_suffix: "-output"
          fail_fast: "true"
          earthdata_user: ${{ secrets.EARTHDATA_USER }}
          earthdata_pass: ${{ secrets.EARTHDATA_PASS }}

      - name: Upload notebook outputs
        if: always() && !inputs.skip_tests
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/*-output.ipynb
          if-no-files-found: warn
          retention-days: 7

      - name: Validate packages
        if: ${{ !inputs.skip_tests }}
        uses: ./.github/actions/validate-packages
        with:
          image: ${{ env.TEST_IMAGE }}:${{ env.TAG }}
          python_version: "3.13"

      - name: Upload validation results
        if: always() && !inputs.skip_tests
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            reproducibility/packages-python-pinned.yaml
            reproducibility/packages-r-pinned.R
            reproducibility/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Push the test image
        run: |
          set -euo pipefail
          docker push ${TEST_IMAGE}:${TAG}
          docker push ${TEST_IMAGE}:latest
          echo "Pushed ${TEST_IMAGE}:${TAG} and :latest"
