name: py-rocket-geospatial
channels:
  - conda-forge
  - nodefaults

dependencies:
   # File formats and file management, download, dataset caching
  - nco
  - pooch
  - rechunker
  - cftime # for decoding time units and variable values in a netCDF file
  - h5coro # reading HDF5 data stored in S3
  - hdf5plugin # provides HDF5 compression filters
  - lxml # processing XML and HTML
  - pynco # python style access to the NetCDF Operators (NCO)
  - duckdb
  - fastparquet
  - polars

  # Virtual / cloud-optimized stack (Icechunk). Minimum versions come from the
  # ocean-icechunks requirements files and the virtual-icechunk skill; several are
  # needed only indirectly (see comments).
  - icechunk>=2.3
  - virtualizarr>=2.8
  - zarr>=3.4
  - xarray>=2026.9
  - obstore>=0.12
  - obspec_utils>=0.9 # conda-forge name uses an underscore
  - kerchunk>=0.2.10
  - scipy>=1.17 # kerchunk's NetCDF-3 parser subclasses scipy's netcdf_file
  - h5py>=3.16
  - h5netcdf>=1.8
  - netcdf4>=1.7 # needed for '#mode=bytes' streaming reads
  - fsspec>=2026.2
  - aiohttp>=3.13 # fsspec HTTPFileSystem is async; requests alone fails
  - dask>=2026.1 # open_zarr(..., chunks={}) needs a chunk manager

  # Cloud access tools and libraries
  - awscli>=2 # AWS CLI v2 (conda-forge builds v2 under this name); replaces awscliv2, whose `awsv2 --install` needs Docker and fails on a hub (py-rocket-base#305)
  - rclone # bulk copies to S3 / GCS / Source Cooperative
  - s5cmd # fast parallel S3 copies
  - boto3
  - s3fs>=2023.6.0
  # handle login and similar details for accessing earthdata protected data
  # Access datasets exposed via STAC
  - pystac-client
  - stackstac
  # Access datasets exposed via intake catalogs
  - intake
  - intake-xarray
  - intake-erddap
  - intake-esm>=2023.7.7
  - intake-stac==0.4.0
  - gcsfs>=2023.5.0
  - google-cloud-storage
  - adlfs # Azure blob storage
  - certifi # Root Certificates for validating the trustworthiness of SSL certificates.

  # Specific cloud access libraries
  - copernicusmarine # get data from copernicus
  - earthaccess>=0.18 # get data from nasa earth access
  - pydap # OPeNDAP implementation
  - erddapy # connect to erddap servers
 # if ECMWF is needed, install in separate env. This causes many downgrades incl gdal
 # - ecmwflibs # wraps some of European Centre for Medium-Range Weather Forecasts libraries
  - harmony-py

  # Dev / quality-of-life
  - pytest
  - pytest-cov
  - ruff
  - tqdm
  - joblib
  - jupyter-cache # (#68)

  - pip:
    - xq
